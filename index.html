<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Intermap – Roskilde centrum</title>
  <meta name="theme-color" content="#1f5f8b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Intermap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Intermap</h1>
    <span id="net-status" class="net" title="Netværksstatus"></span>
  </header>

  <div id="map" aria-label="Kort"></div>

  <div class="fab-row">
    <button id="btn-locate" class="fab primary" type="button">📍 Her er jeg</button>
    <select id="radius" class="fab" aria-label="Radius">
      <option value="200">200 m</option>
      <option value="250" selected>250 m</option>
      <option value="300">300 m</option>
    </select>
  </div>

  <section id="nearby" class="sheet" hidden>
    <div class="sheet-head">
      <strong id="nearby-title">I nærheden</strong>
      <button id="nearby-close" class="icon-btn" type="button" aria-label="Luk">✕</button>
    </div>
    <p id="nearby-msg" class="muted"></p>
    <ul id="nearby-list"></ul>
  </section>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close></div>
    <article class="modal-card">
      <button class="icon-btn modal-close" type="button" data-close aria-label="Luk">✕</button>
      <img id="modal-img" alt="">
      <div class="modal-body">
        <h2 id="modal-title"></h2>
        <p id="modal-dist" class="muted"></p>
        <p id="modal-text"></p>
      </div>
    </article>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
